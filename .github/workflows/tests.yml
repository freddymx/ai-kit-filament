# Runs the test suite when a new version is released (not on every push).
#
# composer.json declares local path repositories for ai-kit-core (../ai-kit-core) and
# ai-kit-ui-livewire (../ai-kit-ui-livewire) so cross-package changes can be tested
# together; CI clones both siblings first. The packages themselves are published on
# Packagist as freddymx/ai-kit-*.
name: tests

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pest:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Clone sibling packages (path dependencies)
        run: |
          git clone --depth=1 https://github.com/freddymx/ai-kit-core.git ../ai-kit-core
          git clone --depth=1 https://github.com/freddymx/ai-kit-ui-livewire.git ../ai-kit-ui-livewire

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
